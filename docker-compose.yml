services:

  postgres:
    image: postgres:16-alpine
    container_name: streaming_postgres
    environment:
      POSTGRES_DB: streaming_db
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: tu_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streaming_user -d streaming_db']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streaming_redis
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streaming_backend
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  rtmp-server:
    build:
      context: ./rtmp-server
      dockerfile: Dockerfile
    container_name: streaming_rtmp
    ports:
      - '1935:1935'
      - '8890:8890/udp'
      - '8000:8000'
    environment:
      - BACKEND_URL=http://backend:3000
    volumes:
      - hls_streams:/app/streams
    depends_on:
      - backend
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: streaming_web
    ports:
      - '5173:80'
    depends_on:
      - backend
      - rtmp-server

volumes:
  postgres_data:
  hls_streams:
